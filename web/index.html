    <!-- JackTrade is dark only: there is no light theme. -->
    <script>document.documentElement.dataset.theme = 'dark';</script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" />
    <!-- Anti-clickjacking: with a session key, a click opens or closes a trade without a wallet prompt, so the app never
         runs inside another site's frame. It stays hidden and tries to take over the top window. -->
    <style id="hm-antiframe">html { display: none !important; }</style>
    <script>
      if (window.self === window.top) document.getElementById("hm-antiframe").remove();
      else try { window.top.location = window.self.location.href; } catch (_) { /* sandboxed frame: stays hidden */ }
    </script>
  </head>
