<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="JackTrade — leveraged trading on Robinhood Chain, from Grok." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>JackTrade</title>
    <script>
      try {
        const requested = new URLSearchParams(location.search).get('theme');
        const saved = localStorage.getItem('jacktrade.theme');
        document.documentElement.dataset.theme = ['light', 'dark'].includes(requested) ? requested : saved === 'dark' ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
    <!-- Anti-clickjacking: with a session key, a click opens or closes a trade without a wallet prompt, so the app never
         runs inside another site's frame. It stays hidden and tries to take over the top window. -->
    <style id="jt-antiframe">html { display: none !important; }</style>
    <script>
      if (window.self === window.top) document.getElementById("jt-antiframe").remove();
      else try { window.top.location = window.self.location.href; } catch (_) { /* sandboxed frame: stays hidden */ }
    </script>
  </head>

</html>
